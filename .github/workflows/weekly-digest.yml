name: Weekly AI Digest

on:
  schedule:
    - cron: "30 10 * * 1"  # Every Monday at 6:30am EDT (10:30am UTC)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send only to RESEND_TO instead of full subscriber list'
        type: boolean
        default: true

jobs:
  ecosystem:
    name: AI Ecosystem Digest
    runs-on: ubuntu-latest
    env:
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RESEND_TO: ${{ secrets.RESEND_TO }}
      SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_SUBSCRIBERS_TOKEN: ${{ secrets.GH_SUBSCRIBERS_TOKEN }}
      GH_DIGESTS_TOKEN: ${{ secrets.GH_DIGESTS_TOKEN }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
      CT0: ${{ secrets.CT0 }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch subscribers
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            echo "$RESEND_TO" > /tmp/subscribers.txt
          else
            curl -f -s \
              -H "Authorization: Bearer $GH_SUBSCRIBERS_TOKEN" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/louloret/last30days-subscribers/contents/subscribers.txt" \
              > /tmp/subscribers.txt
          fi
          echo "Subscribers: $(wc -l < /tmp/subscribers.txt)"

      - name: Run ecosystem digest
        run: |
          cat > /tmp/plan.json << 'EOF'
          {"intent":"product","freshness_mode":"strict_recent","cluster_mode":"none","subqueries":[{"label":"practical-agent-workflows","search_query":"AI agent workflow automation case study","ranking_query":"What concrete AI agent workflow implementations and case studies are developers sharing this week?","sources":["reddit","hackernews","x"],"weight":1.0},{"label":"agent-execution","search_query":"AI agent browser automation tool use workflow","ranking_query":"What are developers building with AI agents that automate browser tasks, API calls, and file operations?","sources":["reddit","hackernews","x"],"weight":0.9},{"label":"mcp-integrations","search_query":"MCP server Model Context Protocol integration workflow","ranking_query":"What new MCP server integrations are being built and shipped?","sources":["reddit","hackernews","x"],"weight":0.8},{"label":"builder-workflows","search_query":"Claude Code Cursor n8n AI workflow","ranking_query":"What workflows are practitioners building with Claude Code, Cursor, n8n, and similar tools?","sources":["reddit","hackernews","x"],"weight":0.8},{"label":"agent-reliability","search_query":"AI agent evaluation tracing human-in-the-loop","ranking_query":"What are developers learning about making AI agents reliable, traceable, and safe in production?","sources":["reddit","hackernews"],"weight":0.7},{"label":"agent-education","search_query":"AI agent tutorial diagram harness setup guide open source GitHub","ranking_query":"What diagrams, setup guides, and open source harnesses are helping developers understand and implement agent workflows?","sources":["reddit","hackernews","x"],"weight":0.6}]}
          EOF

          NOW=$(date -u "+%Y-%m-%d %H:%M:%S")
          HEADER="=== AI Ecosystem Digest · ${NOW} (last 7 days) ==="
          (
            echo "${HEADER}"
            python scripts/last30days.py "AI agent workflow automation MCP Claude Code" \
              --agent --emit=compact --days=7 --quick \
              --save-dir=/tmp/digests --save-suffix=ecosystem \
              --subreddits=claudeskills,AI_Agents,AskVibeCoders,LangChain,LocalLLaMA,ClaudeAI \
              --plan "$(cat /tmp/plan.json)"
          ) | python digest/email_digest.py --terms "agent workflow" "MCP server" "Claude Code" "automation" \
              --trending-days 7 \
              --subscribers-file /tmp/subscribers.txt \
              --save-md /tmp/digest.md

      - name: Publish to agentic-digests
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_DIGESTS_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          FILE_PATH="ai-ecosystem/${DATE}.md"
          CONTENT=$(base64 -w0 /tmp/digest.md)
          SHA=$(gh api "/repos/louloret/agentic-digests/contents/${FILE_PATH}" --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api --method PUT "/repos/louloret/agentic-digests/contents/${FILE_PATH}" \
              --field "message=digest: ai-ecosystem ${DATE}" \
              --field "content=${CONTENT}" \
              --field "sha=${SHA}" --silent
          else
            gh api --method PUT "/repos/louloret/agentic-digests/contents/${FILE_PATH}" \
              --field "message=digest: ai-ecosystem ${DATE}" \
              --field "content=${CONTENT}" --silent
          fi
          echo "Published: ${FILE_PATH}"

  marketing:
    name: AI Marketing Digest
    needs: ecosystem
    runs-on: ubuntu-latest
    env:
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RESEND_TO: ${{ secrets.RESEND_TO }}
      SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_SUBSCRIBERS_TOKEN: ${{ secrets.GH_SUBSCRIBERS_TOKEN }}
      GH_DIGESTS_TOKEN: ${{ secrets.GH_DIGESTS_TOKEN }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
      CT0: ${{ secrets.CT0 }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch subscribers
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            echo "$RESEND_TO" > /tmp/subscribers.txt
          else
            curl -f -s \
              -H "Authorization: Bearer $GH_SUBSCRIBERS_TOKEN" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/louloret/last30days-subscribers/contents/subscribers.txt" \
              > /tmp/subscribers.txt
          fi
          echo "Subscribers: $(wc -l < /tmp/subscribers.txt)"

      - name: Run marketing digest
        run: |
          cat > /tmp/plan.json << 'EOF'
          {"intent":"product","freshness_mode":"strict_recent","cluster_mode":"none","subqueries":[{"label":"marketing-agent-workflows","search_query":"AI agent marketing workflow automation case study","ranking_query":"What AI agent marketing workflow case studies are practitioners sharing?","sources":["reddit","hackernews","x"],"weight":1.0},{"label":"marketing-ops","search_query":"AI marketing campaign reporting content workflow automation","ranking_query":"What AI tools are marketers using for campaign management, reporting, and content workflows?","sources":["reddit","hackernews","x"],"weight":0.9},{"label":"growth-experiments","search_query":"AI marketing experimentation personalization optimization workflow","ranking_query":"What AI-powered marketing experiments, personalization, and optimization workflows are showing results?","sources":["reddit","hackernews","x"],"weight":0.8},{"label":"revenue-ops","search_query":"AI lead enrichment qualification scoring CRM workflow","ranking_query":"What AI workflows are teams using for lead enrichment, scoring, qualification, and CRM automation?","sources":["reddit","hackernews"],"weight":0.7},{"label":"marketing-agent-education","search_query":"AI marketing agent tutorial workflow diagram step by step GitHub","ranking_query":"What diagrams, guides, and open source examples are helping marketers understand and implement AI agent workflows?","sources":["reddit","hackernews","x"],"weight":0.6}]}
          EOF

          NOW=$(date -u "+%Y-%m-%d %H:%M:%S")
          HEADER="=== AI Marketing Digest · ${NOW} (last 7 days) ==="
          (
            echo "${HEADER}"
            python scripts/last30days.py "AI agent marketing workflow automation" \
              --agent --emit=compact --days=14 --quick \
              --save-dir=/tmp/digests --save-suffix=marketing \
              --subreddits=aiToolForBusiness,AskMarketing,generativeAI,DigitalMarketing,Entrepreneur,SaaS,ecommerce \
              --plan "$(cat /tmp/plan.json)"
          ) | python digest/email_digest.py --terms "agent workflow" "ai marketing" "automation" "CRM" \
              --trending-days 14 \
              --subscribers-file /tmp/subscribers.txt \
              --save-md /tmp/digest.md

      - name: Publish to agentic-digests
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_DIGESTS_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          FILE_PATH="ai-marketing/${DATE}.md"
          CONTENT=$(base64 -w0 /tmp/digest.md)
          SHA=$(gh api "/repos/louloret/agentic-digests/contents/${FILE_PATH}" --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api --method PUT "/repos/louloret/agentic-digests/contents/${FILE_PATH}" \
              --field "message=digest: ai-marketing ${DATE}" \
              --field "content=${CONTENT}" \
              --field "sha=${SHA}" --silent
          else
            gh api --method PUT "/repos/louloret/agentic-digests/contents/${FILE_PATH}" \
              --field "message=digest: ai-marketing ${DATE}" \
              --field "content=${CONTENT}" --silent
          fi
          echo "Published: ${FILE_PATH}"
